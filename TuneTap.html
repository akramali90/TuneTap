<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0f1a">
<title>TuneTap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0e0f1a;--card:#181a2b;--line:#2a2d45;--ink:#f3f1ea;--mute:#9a9cb6;--hot:#ff5a36;--ok:#2fd18a;--warn:#ffc24b;--bad:#ff4d6d;--sel:#ff5a36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left)}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;margin:4px 0 10px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mute{color:var(--mute)} .small{font-size:12.5px}
button{font:600 15px Inter,sans-serif;border:0;border-radius:12px;padding:12px 16px;background:#2a2d45;color:var(--ink);cursor:pointer}
button.pri{background:var(--hot);color:#fff}
button.ok{background:var(--ok);color:#06281a}
button.bad{background:var(--bad);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.45}
button.sm{padding:8px 11px;font-size:13px;border-radius:10px}
input,textarea,select{font:15px Inter,sans-serif;color:var(--ink);background:#0b0c15;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical}
label{font-size:13px;color:var(--mute);display:block;margin:8px 0 4px}
.hero{padding:28px 0 8px}
.tag{display:inline-block;background:#24263c;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--mute)}
.tag.hot{background:rgba(255,90,54,.18);color:#ffb39f}
.songs{max-height:46vh;overflow:auto;margin-top:8px}
.song{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.song img{width:52px;height:39px;object-fit:cover;border-radius:6px;background:#000}
.song .f{display:grid;grid-template-columns:1fr 1fr 64px;gap:6px}
.song input{padding:7px;font-size:13.5px}
.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}
.tabs button{padding:8px 12px;font-size:13.5px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
#ytbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#ytbox iframe,#yt{position:absolute;inset:0;width:100%;height:100%}
#cover{position:absolute;left:0;right:0;top:0;height:16%;background:#000;display:none;pointer-events:none;z-index:2}
#mask{position:absolute;inset:0;display:none;z-index:3;background:radial-gradient(circle at 50% 50%,#262a4a,#000);align-items:center;justify-content:center;flex-direction:column}
.tv #cover{display:block}
.big{font-size:64px;font-weight:800;font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;line-height:1}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ctrl button{padding:12px 6px;font-size:14px}
.now{margin-top:10px;padding:10px 12px;border-radius:12px;background:#0b0c15;border:1px dashed var(--line)}
.tv .hide-tv{display:none!important}
.plist .p{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--bad)}
.dot.on{background:var(--ok)}
.grid{display:grid;gap:5px;margin-top:10px}
.cell{aspect-ratio:1;border-radius:10px;background:#20233a;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden;user-select:none;cursor:pointer;transition:transform .08s}
.cell:active{transform:scale(.96)}
.cell .t{font-weight:700;font-size:var(--fs,12px);line-height:1.12;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cell .a{font-size:calc(var(--fs,12px)*.82);color:var(--mute);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.m{background:var(--sel);border-color:var(--sel)} .cell.m .a{color:#ffe1d8}
.cell.free{background:#2c2f4d;font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;font-weight:800;color:var(--warn)}
.cell.played{outline:2px solid var(--ok);outline-offset:-2px}
.cell.wrong{outline:2px dashed var(--bad);outline-offset:-2px}
.bingo{width:100%;font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;font-size:30px;font-weight:800;padding:16px;margin-top:14px;border-radius:16px;background:var(--hot);color:#fff;letter-spacing:.04em}
.modal{position:fixed;inset:0;background:rgba(5,6,12,.86);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:calc(env(safe-area-inset-top) + 20px) 14px 30px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:520px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:92vw;display:none;text-align:center}
.banner{padding:12px;border-radius:12px;margin-top:10px;font-weight:600;text-align:center}
.banner.win{background:rgba(47,209,138,.16);color:#9cf0c8}
.qr{background:#fff;padding:12px;border-radius:14px;display:inline-block}
.code{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;font-weight:800;font-size:40px;letter-spacing:.12em}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--ink);font-size:14.5px}
.chk input{width:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ Pure game logic (also unit-tested) ============ */
const Logic = (() => {
  const PATTERNS = {
    line:    { name: 'One line',    desc: 'Any full row, column or diagonal' },
    two:     { name: 'Two lines',   desc: 'Any two full lines' },
    corners: { name: 'Four corners',desc: 'All four corner squares' },
    full:    { name: 'Full house',  desc: 'Every square on the card' }
  };
  function ytId(s) {
    s = String(s || '').trim();
    const m = s.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    return null;
  }
  function ytStart(s) {
    const m = String(s || '').match(/[?&](?:t|start)=([0-9hms]+)/);
    return m ? parseTime(m[1]) : 0;
  }
  function parseTime(t) {
    t = String(t || '').trim();
    if (!t) return 0;
    if (/^\d+$/.test(t)) return +t;
    let m = t.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
    if (m) return m[3] ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : (+m[1]) * 60 + (+m[2]);
    m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
    if (m && (m[1] || m[2] || m[3])) return (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0));
    return 0;
  }
  function fmtTime(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  /* "Artist - Title (Official Video)" -> {artist,title} */
  function splitYtTitle(raw, author) {
    let s = String(raw || '').replace(/\s*[\(\[][^\)\]]*(official|video|audio|lyric|lyrics|hd|4k|remaster|mv|visualizer|full song)[^\)\]]*[\)\]]/ig, '')
      .replace(/\s*\|.*$/, '').replace(/\s+/g, ' ').trim();
    const m = s.match(/^(.+?)\s+[-–—]\s+(.+)$/);
    if (m) return { artist: m[1].trim(), title: m[2].replace(/["“”]/g, '').trim() };
    return { artist: String(author || '').replace(/\s*-\s*Topic$/, '').replace(/VEVO$/i, '').trim(), title: s.replace(/["“”]/g, '') };
  }
  /* One pasted line: "url | title | artist | start" (all but url optional) */
  function parseLine(line) {
    const parts = String(line).split('|').map(x => x.trim());
    const urlIdx = parts.findIndex(p => ytId(p.split(/\s+/).find(w => ytId(w)) || ''));
    if (urlIdx < 0) return null;
    const word = parts[urlIdx].split(/\s+/).find(w => ytId(w));
    const id = ytId(word);
    const rest = parts.filter((_, i) => i !== urlIdx);
    const leftover = parts[urlIdx].replace(word, '').trim();
    let title = rest[0] || '', artist = rest[1] || '', start = rest[2] ? parseTime(rest[2]) : ytStart(word);
    if (!title && leftover) { const s = splitYtTitle(leftover); title = s.title; artist = artist || s.artist; }
    return { id, title, artist, start };
  }
  function cellsFor(size) { return size * size; }
  function songsNeeded(size, free) { return cellsFor(size) - (free && size % 2 === 1 ? 1 : 0); }
  function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  /* Card = array of song indexes, -1 = free square */
  function makeCard(nSongs, size, free, rnd = Math.random) {
    const need = songsNeeded(size, free);
    if (nSongs < need) throw new Error('Need at least ' + need + ' songs');
    const pick = shuffle([...Array(nSongs).keys()], rnd).slice(0, need);
    if (free && size % 2 === 1) pick.splice(Math.floor(cellsFor(size) / 2), 0, -1);
    return pick;
  }
  function lines(size) {
    const L = [];
    for (let r = 0; r < size; r++) L.push([...Array(size).keys()].map(c => r * size + c));
    for (let c = 0; c < size; c++) L.push([...Array(size).keys()].map(r => r * size + c));
    L.push([...Array(size).keys()].map(i => i * size + i));
    L.push([...Array(size).keys()].map(i => i * size + (size - 1 - i)));
    return L;
  }
  /* covered[i] true when square i is free or its song has been played */
  function covered(card, playedSet) { return card.map(s => s === -1 || playedSet.has(s)); }
  function meets(pattern, cov, size) {
    const full = L => L.every(i => cov[i]);
    const n = lines(size).filter(full).length;
    if (pattern === 'line') return n >= 1;
    if (pattern === 'two') return n >= 2;
    if (pattern === 'corners') return [0, size - 1, size * (size - 1), size * size - 1].every(i => cov[i]);
    if (pattern === 'full') return cov.every(Boolean);
    return false;
  }
  function code(rnd = Math.random) { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(rnd() * A.length)]; return s; }
  return { PATTERNS, ytId, ytStart, parseTime, fmtTime, splitYtTitle, parseLine, songsNeeded, shuffle, makeCard, lines, covered, meets, code };
})();
if (typeof module !== 'undefined') module.exports = Logic;
</script>

<script>
'use strict';
if (typeof window !== 'undefined') (function () {
const L = Logic;
const $ = s => document.querySelector(s);
const app = $('#app');
const PREFIX = 'tunetap-v1-';
const store = {
  get(k, d) { try { const v = localStorage.getItem('cb_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cb_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('cb_' + k); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms); }
function modal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
const baseUrl = () => location.origin + location.pathname;
const peerOk = () => typeof Peer !== 'undefined';

function fitCells(gridEl, size) {
  const w = gridEl.clientWidth / size;
  gridEl.style.setProperty('--fs', Math.max(9, Math.min(16, w / 6.2)) + 'px');
}
function cardHtml(card, songs, opts = {}) {
  const size = Math.round(Math.sqrt(card.length));
  return `<div class="grid" style="grid-template-columns:repeat(${size},1fr)" data-size="${size}">` + card.map((s, i) => {
    if (s === -1) return `<div class="cell free m" data-i="${i}">FREE</div>`;
    const song = songs[s] || {};
    const cls = ['cell'];
    if (opts.marks && opts.marks[i]) cls.push('m');
    if (opts.played) { if (opts.played.has(s)) cls.push('played'); else if (opts.marks && opts.marks[i]) cls.push('wrong'); }
    return `<div class="${cls.join(' ')}" data-i="${i}"><div class="t">${esc(song.title || 'Untitled')}</div>${song.artist ? `<div class="a">${esc(song.artist)}</div>` : ''}</div>`;
  }).join('') + '</div>';
}

/* ======================= ROUTER ======================= */
const params = new URLSearchParams(location.search);
const joinCode = (params.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
if (joinCode) Player(joinCode); else Home();

function Home() {
  const g = store.get('game', null);
  app.innerHTML = `
  <div class="hero"><span class="tag hot">Music-video bingo</span><h1 style="margin-top:10px">TuneTap</h1>
  <p class="mute">You host from this phone. Clips play from YouTube, players join on their own phones by QR code.</p></div>
  ${g && g.status !== 'ended' ? `<div class="panel"><h2>Game in progress</h2><p class="mute small">Code ${esc(g.code)} · ${g.played.length} of ${g.order.length} songs played · ${Object.keys(g.players).length} players</p>
  <div class="row"><button class="pri grow" id="resume">Resume game</button><button class="ghost" id="endOld">End it</button></div></div>` : ''}
  <div class="panel"><h2>Host a game</h2><button class="pri" style="width:100%" id="host">Set up songs &amp; start</button></div>
  <div class="panel"><h2>Join a game</h2><div class="row"><input id="jc" placeholder="Game code" maxlength="5" style="text-transform:uppercase;flex:1"><button id="jb">Join</button></div></div>
  ${peerOk() ? '' : '<div class="panel" style="border-color:var(--bad)">The live connection library did not load. Check your internet connection and reload.</div>'}`;
  $('#host').onclick = Setup;
  $('#jb').onclick = () => { const c = $('#jc').value.trim().toUpperCase(); if (c.length === 5) location.href = baseUrl() + '?join=' + c; else toast('Codes are 5 characters'); };
  if ($('#resume')) $('#resume').onclick = () => Host(store.get('game'));
  if ($('#endOld')) $('#endOld').onclick = () => { store.del('game'); Home(); };
}

/* ======================= SETUP ======================= */
function Setup() {
  let songs = store.get('library', []);
  const cfg = Object.assign({ size: 5, free: true, clip: 30, rounds: ['line', 'two', 'full'] }, store.get('cfg', {}));
  function save() { store.set('library', songs); }
  function render() {
    const need = L.songsNeeded(cfg.size, cfg.free);
    app.innerHTML = `
    <div class="row" style="padding-top:12px"><button class="ghost sm" id="back">← Back</button><span class="grow"></span><span class="tag">${songs.length} songs</span></div>
    <div class="panel"><h2>1 · Add YouTube songs</h2>
      <p class="mute small">Paste links, one per line. Titles fill in by themselves. Optional: <code>link | Title | Artist | 1:05</code> to set the name and the clip start.</p>
      <textarea id="paste" placeholder="https://youtu.be/...&#10;https://www.youtube.com/watch?v=..."></textarea>
      <div class="row" style="margin-top:8px"><button class="pri" id="add">Add songs</button><button class="ghost sm" id="copy">Copy list</button><button class="ghost sm" id="clear">Clear all</button></div>
      <div class="songs" id="list">${songs.map((s, i) => `
        <div class="song" data-i="${i}"><img src="https://i.ytimg.com/vi/${esc(s.id)}/default.jpg" alt="">
          <div class="f"><input data-k="title" value="${esc(s.title)}" placeholder="Title"><input data-k="artist" value="${esc(s.artist)}" placeholder="Artist"><input data-k="start" value="${L.fmtTime(s.start)}" placeholder="0:00" inputmode="numeric"></div>
          <button class="ghost sm" data-del="${i}">✕</button></div>`).join('')}</div>
      ${songs.length ? '<p class="mute small">Last box = where the clip starts. Pick the chorus or the most recognisable bit.</p>' : ''}
    </div>
    <div class="panel"><h2>2 · Game settings</h2>
      <label>Card size</label><select id="size"><option value="3">3 × 3 (9 songs, quick)</option><option value="4">4 × 4 (16 songs)</option><option value="5">5 × 5 (24 songs + free square)</option></select>
      ${cfg.size === 5 ? `<label class="chk"><input type="checkbox" id="free" ${cfg.free ? 'checked' : ''}> Free square in the middle</label>` : ''}
      <label>Clip length</label><select id="clip">${[15, 20, 30, 45, 60, 0].map(v => `<option value="${v}" ${cfg.clip === v ? 'selected' : ''}>${v ? v + ' seconds' : 'Full song'}</option>`).join('')}</select>
      <label>Rounds (played in this order)</label>
      ${Object.entries(L.PATTERNS).map(([k, p]) => `<label class="chk"><input type="checkbox" data-r="${k}" ${cfg.rounds.includes(k) ? 'checked' : ''}> ${p.name} <span class="mute small">— ${p.desc}</span></label>`).join('')}
    </div>
    <div class="panel">
      ${songs.length < need ? `<p class="mute">Add at least <b>${need - songs.length}</b> more song${need - songs.length === 1 ? '' : 's'} for this card size.</p>` :
        songs.length < Math.ceil(need * 1.6) ? `<p class="mute small">Works, but with only ${songs.length} songs the cards will look alike. ${Math.ceil(need * 1.6)}+ songs gives more varied cards.</p>` : ''}
      <button class="pri" style="width:100%" id="start" ${songs.length < need || !cfg.rounds.length ? 'disabled' : ''}>Start game</button></div>`;
    $('#size').value = cfg.size;
    $('#back').onclick = Home;
    $('#add').onclick = addSongs;
    $('#clear').onclick = () => { if (songs.length && $('#clear').dataset.sure) { songs = []; save(); render(); } else { $('#clear').dataset.sure = 1; $('#clear').textContent = 'Tap again to clear'; } };
    $('#copy').onclick = async () => { const txt = songs.map(s => `https://youtu.be/${s.id} | ${s.title} | ${s.artist} | ${L.fmtTime(s.start)}`).join('\n'); try { await navigator.clipboard.writeText(txt); toast('Song list copied — paste it in Notes as a backup'); } catch (e) { $('#paste').value = txt; toast('Copy it from the box above'); } };
    $('#size').onchange = e => { cfg.size = +e.target.value; store.set('cfg', cfg); render(); };
    if ($('#free')) $('#free').onchange = e => { cfg.free = e.target.checked; store.set('cfg', cfg); render(); };
    $('#clip').onchange = e => { cfg.clip = +e.target.value; store.set('cfg', cfg); };
    app.querySelectorAll('[data-r]').forEach(cb => cb.onchange = () => { cfg.rounds = Object.keys(L.PATTERNS).filter(k => app.querySelector(`[data-r="${k}"]`).checked); store.set('cfg', cfg); render(); });
    app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { songs.splice(+b.dataset.del, 1); save(); render(); });
    app.querySelectorAll('.song input').forEach(inp => inp.onchange = () => {
      const s = songs[+inp.closest('.song').dataset.i]; const k = inp.dataset.k;
      s[k] = k === 'start' ? L.parseTime(inp.value) : inp.value.trim(); save();
    });
    $('#start').onclick = () => {
      if (cfg.size !== 5) cfg.free = false;
      const missing = songs.filter(s => !s.title).length;
      if (missing) { toast(missing + ' song(s) still have no title — add them first'); return; }
      const game = { code: L.code(), created: Date.now(), songs: songs.map(s => ({ ...s })), cfg: { ...cfg, free: cfg.size === 5 && cfg.free },
        order: L.shuffle([...songs.keys()]), played: [], current: -1, round: 0, status: 'playing', players: {}, winners: [], claims: [] };
      store.set('game', game); Host(game);
    };
  }
  async function addSongs() {
    const lines = $('#paste').value.split(/\n+/).map(l => l.trim()).filter(Boolean);
    let added = 0, dup = 0, bad = 0; const fresh = [];
    for (const ln of lines) {
      const s = L.parseLine(ln);
      if (!s) { bad++; continue; }
      if (songs.some(x => x.id === s.id)) { dup++; continue; }
      songs.push(s); fresh.push(s); added++;
    }
    save(); $('#paste').value = ''; render();
    toast(`Added ${added}` + (dup ? ` · ${dup} already in list` : '') + (bad ? ` · ${bad} not YouTube links` : ''));
    for (const s of fresh.filter(x => !x.title)) {
      try {
        const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + s.id));
        const j = await r.json();
        if (j && j.title) { const p = L.splitYtTitle(j.title, j.author_name); s.title = p.title; s.artist = s.artist || p.artist; save(); render(); }
      } catch (e) { /* user can type it */ }
    }
  }
  render();
}

/* ======================= HOST ======================= */
function Host(game) {
  const G = game;
  const conns = {};            // token -> DataConnection
  let peer = null, yt = null, ytReady = false, tab = 'play', tvMode = false, showTitle = false, retryT = null;
  const save = () => store.set('game', G);
  const playedSet = () => new Set(G.played);
  const pattern = () => G.cfg.rounds[G.round];
  const joinUrl = () => baseUrl() + '?join=' + G.code;

  /* --- live link --- */
  function startPeer() {
    if (!peerOk()) { toast('No connection library — check internet'); return; }
    try { peer && peer.destroy(); } catch (e) {}
    peer = new Peer(PREFIX + G.code, { debug: 0 });
    peer.on('open', () => { setNet(true); });
    peer.on('disconnected', () => { setNet(false); setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
    peer.on('error', err => {
      setNet(false);
      if (err.type === 'unavailable-id') { clearTimeout(retryT); retryT = setTimeout(startPeer, 4000); }   // old session still registered
      else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) { clearTimeout(retryT); retryT = setTimeout(startPeer, 3000); }
    });
    peer.on('connection', conn => {
      conn.on('data', d => onMsg(conn, d));
      conn.on('close', () => { for (const t in conns) if (conns[t] === conn) { delete conns[t]; if (G.players[t]) G.players[t].online = false; } refresh(); });
    });
  }
  let netOk = false;
  function setNet(v) { netOk = v; const el = $('#net'); if (el) el.innerHTML = `<span class="dot ${v ? 'on' : ''}"></span>${v ? 'Live' : 'Connecting…'}`; }
  function send(token, msg) { const c = conns[token]; if (c && c.open) try { c.send(msg); } catch (e) {} }
  function stateMsg(token) {
    const p = G.players[token];
    return { t: 'state', status: G.status, songNo: G.played.length, total: G.order.length,
      round: G.round + 1, rounds: G.cfg.rounds.length, pattern: pattern() || null,
      patternName: pattern() ? L.PATTERNS[pattern()].name : 'Game over',
      winners: G.winners.map(w => ({ name: G.players[w.token] ? G.players[w.token].name : 'Someone', round: w.round, pattern: w.pattern })),
      you: p ? { card: p.card, songs: p.card.map(i => i === -1 ? null : { title: G.songs[i].title, artist: G.songs[i].artist }), marks: p.marks, name: p.name } : null };
  }
  function broadcast() { for (const t in conns) send(t, stateMsg(t)); }
  function onMsg(conn, d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'hello') {
      let token = String(d.token || '').slice(0, 40);
      const name = String(d.name || 'Player').slice(0, 24).trim() || 'Player';
      if (!token || !G.players[token]) {
        if (G.status === 'ended') { try { conn.send({ t: 'bye', msg: 'This game has finished.' }); } catch (e) {} return; }
        token = token || (Math.random().toString(36).slice(2) + Date.now().toString(36));
        G.players[token] = { name, card: L.makeCard(G.songs.length, G.cfg.size, G.cfg.free), marks: [], joined: Date.now() };
        toast(name + ' joined');
      }
      const p = G.players[token];
      if (conns[token] && conns[token] !== conn) try { conns[token].close(); } catch (e) {}
      conns[token] = conn; p.online = true; conn._token = token;
      if (Array.isArray(d.marks) && d.marks.length <= p.card.length && d.marks.some(Boolean)) p.marks = d.marks.map(Boolean);
      save();
      try { conn.send({ t: 'welcome', token }); } catch (e) {}
      send(token, stateMsg(token)); refresh(); return;
    }
    const token = conn._token, p = G.players[token];
    if (!p) return;
    if (d.t === 'mark') { const i = +d.i; if (i >= 0 && i < p.card.length) { p.marks[i] = !!d.on; save(); } return; }
    if (d.t === 'claim') {
      if (G.status !== 'playing' || !pattern()) return;
      if (G.claims.some(c => c.token === token && c.round === G.round && c.open)) return;
      G.claims.push({ token, round: G.round, at: Date.now(), open: true, songNo: G.played.length });
      save(); buzz([200, 80, 200]); refresh(); showClaim(G.claims.length - 1);
    }
  }

  /* --- claims --- */
  function showClaim(ci) {
    const c = G.claims[ci]; const p = G.players[c.token]; if (!p) return;
    const ps = playedSet();
    const ok = L.meets(pattern(), L.covered(p.card, ps), G.cfg.size);
    const wrongMarks = p.card.filter((s, i) => s !== -1 && p.marks[i] && !ps.has(s)).length;
    modal(`<h2>🔔 ${esc(p.name)} called BINGO</h2>
      <p class="mute small">Round ${G.round + 1}: <b>${L.PATTERNS[pattern()].name}</b> · after song ${c.songNo}</p>
      <div class="banner" style="background:${ok ? 'rgba(47,209,138,.16)' : 'rgba(255,77,109,.16)'};color:${ok ? '#9cf0c8' : '#ffb0bf'}">
        ${ok ? '✓ Their card has the pattern — every needed song has been played.' : '✗ Not yet — the pattern isn\'t complete with the songs played so far.'}</div>
      ${cardHtml(p.card, G.songs, { marks: p.marks, played: ps })}
      <p class="mute small" style="margin-top:8px">Green outline = played. Dashed red = they marked a song that hasn't played${wrongMarks ? ` (${wrongMarks})` : ''}.</p>
      <div class="row" style="margin-top:10px"><button class="ok grow" id="yes" ${ok ? '' : 'disabled'}>✓ Correct — winner</button><button class="bad grow" id="no">✗ Not a bingo</button></div>`);
    const g = $('#modalBox .grid'); fitCells(g, G.cfg.size);
    $('#yes').onclick = () => { c.open = false; c.result = 'won'; G.winners.push({ token: c.token, round: G.round, pattern: pattern(), at: Date.now() }); save(); send(c.token, { t: 'result', ok: true, msg: 'Confirmed! You won ' + L.PATTERNS[pattern()].name + ' 🎉' }); closeModal(); for (const t in conns) if (t !== c.token) send(t, { t: 'announce', msg: `🎉 ${p.name} wins ${L.PATTERNS[pattern()].name}!` }); broadcast(); askNextRound(); };
    $('#no').onclick = () => { c.open = false; c.result = 'no'; save(); send(c.token, { t: 'result', ok: false, msg: 'Not a bingo yet — keep playing!' }); closeModal(); refresh(); nextClaim(); };
  }
  function nextClaim() { const i = G.claims.findIndex(c => c.open && c.round === G.round); if (i >= 0) setTimeout(() => showClaim(i), 250); }
  function askNextRound() {
    const last = G.round >= G.cfg.rounds.length - 1;
    modal(`<h2>Winner confirmed</h2><p class="mute">${last ? 'That was the last round.' : `Next up: <b>${L.PATTERNS[G.cfg.rounds[G.round + 1]].name}</b>. Cards and played songs carry over.`}</p>
      <div class="row" style="margin-top:12px">${last ? '<button class="pri grow" id="fin">End game</button>' : '<button class="pri grow" id="nr">Start next round</button>'}<button class="ghost" id="stay">Allow more winners</button></div>`);
    if ($('#nr')) $('#nr').onclick = () => { G.claims.forEach(c => { if (c.open) { c.open = false; send(c.token, { t: 'result', ok: false, msg: 'Round over — new round started.' }); } }); G.round++; save(); closeModal(); broadcast(); refresh(); toast('Round ' + (G.round + 1) + ': ' + L.PATTERNS[pattern()].name); };
    if ($('#fin')) $('#fin').onclick = () => { endGame(); };
    $('#stay').onclick = () => { closeModal(); refresh(); nextClaim(); };
  }
  function endGame() { G.status = 'ended'; save(); broadcast(); closeModal(); try { yt && yt.stopVideo(); } catch (e) {} refresh(); }

  /* --- YouTube --- */
  function loadYT() {
    if (window.YT && window.YT.Player) return mkPlayer();
    window.onYouTubeIframeAPIReady = mkPlayer;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
  function mkPlayer() {
    if (!$('#yt')) return;
    yt = new YT.Player('yt', { playerVars: { playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0 },
      events: { onReady: () => { ytReady = true; }, onError: e => toast('YouTube can\'t play this video here (it may block embedding). Tap Next.'), onStateChange: e => { if (e.data === 0) { $('#mask') && ($('#mask').style.display = 'flex'); } } } });
  }
  function cur() { return G.current >= 0 ? G.songs[G.current] : null; }
  function playCur(full) {
    const s = cur(); if (!s || !ytReady) { if (!ytReady) toast('Player still loading…'); return; }
    $('#mask').style.display = 'none';
    const o = { videoId: s.id, startSeconds: s.start || 0 };
    if (!full && G.cfg.clip) o.endSeconds = (s.start || 0) + G.cfg.clip;
    yt.loadVideoById(o);
  }
  function nextSong() {
    keepAwake();
    if (G.status !== 'playing') return;
    if (G.played.length >= G.order.length) { toast('All songs have been played'); return; }
    G.current = G.order[G.played.length]; G.played.push(G.current); showTitle = false; save();
    playCur(false); broadcast(); refresh();
  }

  /* --- UI --- */
  function refresh() {
    const s = cur(); const pl = Object.entries(G.players);
    const online = pl.filter(([t]) => conns[t]).length;
    const openClaims = G.claims.filter(c => c.open && c.round === G.round).length;
    $('#hdr').innerHTML = `<div class="row"><span class="tag" id="net"></span><span class="tag">Code <b>${G.code}</b></span><span class="tag">${online}/${pl.length} players</span>
      <span class="tag hot">${G.status === 'ended' ? 'Game over' : `Round ${G.round + 1}/${G.cfg.rounds.length}: ${L.PATTERNS[pattern()].name}`}</span></div>`;
    setNet(netOk);
    $('#count').textContent = G.played.length + ' / ' + G.order.length;
    $('#now').innerHTML = s ? `<div class="small mute">Song ${G.played.length}${G.cfg.clip ? ` · ${G.cfg.clip}s clip from ${L.fmtTime(s.start)}` : ''}</div>
      <div style="font-weight:700;font-size:17px">${showTitle ? esc(s.title) + (s.artist ? ` <span class="mute">— ${esc(s.artist)}</span>` : '') : '•••••• <span class="mute small">(tap Reveal to see)</span>'}</div>` : '<span class="mute">Press <b>Next song</b> to play the first clip.</span>';
    $('#reveal').textContent = showTitle ? 'Hide' : 'Reveal';
    $('#nextBtn').disabled = G.status !== 'playing' || G.played.length >= G.order.length;
    app.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('#claimsTab').textContent = 'Claims' + (openClaims ? ` (${openClaims})` : '');
    const body = $('#tabBody');
    if (tab === 'invite') {
      body.innerHTML = `<div style="text-align:center"><div class="qr" id="qr"></div><div class="code" style="margin-top:10px">${G.code}</div>
        <p class="mute small">Players scan this with their camera, or open the link and type the code.</p>
        <div class="row" style="justify-content:center"><button class="sm" id="cpl">Copy invite link</button></div><p class="small mute" style="word-break:break-all">${esc(joinUrl())}</p></div>`;
      try { new QRCode($('#qr'), { text: joinUrl(), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { $('#qr').textContent = 'QR unavailable'; }
      $('#cpl').onclick = async () => { try { await navigator.clipboard.writeText(`Join my music bingo! ${joinUrl()}`); toast('Link copied — paste it in WhatsApp'); } catch (e) { toast('Copy the link shown below'); } };
    } else if (tab === 'players') {
      body.innerHTML = pl.length ? `<div class="plist">${pl.sort((a, b) => a[1].joined - b[1].joined).map(([t, p]) => `<div class="p"><div><span class="dot ${conns[t] ? 'on' : ''}"></span><b>${esc(p.name)}</b>
        <span class="mute small"> · ${p.marks.filter(Boolean).length} marked${G.winners.some(w => w.token === t) ? ' · 🏆' : ''}</span></div>
        <div class="row"><button class="ghost sm" data-see="${t}">Card</button><button class="ghost sm" data-kick="${t}">Remove</button></div></div>`).join('')}</div>` : '<p class="mute">No players yet. Open <b>Invite</b> and let people scan the QR code.</p>';
      body.querySelectorAll('[data-see]').forEach(b => b.onclick = () => { const p = G.players[b.dataset.see]; modal(`<h2>${esc(p.name)}'s card</h2>${cardHtml(p.card, G.songs, { marks: p.marks, played: playedSet() })}<button style="width:100%;margin-top:12px" id="cl">Close</button>`); fitCells($('#modalBox .grid'), G.cfg.size); $('#cl').onclick = closeModal; });
      body.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => { if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sure?'; return; } const t = b.dataset.kick; send(t, { t: 'bye', msg: 'The host removed you from this game.' }); try { conns[t] && conns[t].close(); } catch (e) {} delete conns[t]; delete G.players[t]; save(); refresh(); });
    } else if (tab === 'claims') {
      const cl = G.claims.slice().reverse();
      body.innerHTML = cl.length ? cl.map(c => { const p = G.players[c.token]; const i = G.claims.indexOf(c); return `<div class="p row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p ? p.name : '?')}</b> <span class="mute small">round ${c.round + 1} · after song ${c.songNo} · ${c.open ? '<span style="color:var(--warn)">waiting</span>' : c.result === 'won' ? '🏆 won' : 'not yet'}</span></div>${c.open && c.round === G.round ? `<button class="pri sm" data-c="${i}">Check</button>` : ''}</div>`; }).join('') : '<p class="mute">No BINGO calls yet.</p>';
      body.querySelectorAll('[data-c]').forEach(b => b.onclick = () => showClaim(+b.dataset.c));
    } else if (tab === 'played') {
      body.innerHTML = G.played.length ? '<ol style="padding-left:22px;margin:0">' + G.played.map(i => `<li style="padding:3px 0">${esc(G.songs[i].title)} <span class="mute small">— ${esc(G.songs[i].artist)}</span></li>`).join('') + '</ol>' : '<p class="mute">Nothing played yet.</p>';
    } else {
      body.innerHTML = `<p class="mute small"><b>TV tip:</b> Control Centre → Screen Mirroring to an Apple TV / AirPlay TV, then switch on <b>TV mode</b> so titles and players are hidden from the room.</p>
        ${G.winners.length ? '<h3 style="margin:10px 0 6px">Winners</h3>' + G.winners.map(w => `<div>🏆 ${esc(G.players[w.token] ? G.players[w.token].name : 'Someone')} <span class="mute small">— ${L.PATTERNS[w.pattern].name}</span></div>`).join('') : ''}
        <div class="row" style="margin-top:14px">${G.status === 'ended' ? '<button class="pri grow" id="newg">New game</button>' : '<button class="ghost grow" id="endg">End game</button>'}</div>`;
      if ($('#endg')) $('#endg').onclick = e => { if (!e.target.dataset.sure) { e.target.dataset.sure = 1; e.target.textContent = 'Tap again to end the game'; return; } endGame(); };
      if ($('#newg')) $('#newg').onclick = () => { store.del('game'); try { peer && peer.destroy(); } catch (e) {} Setup(); };
    }
  }
  app.innerHTML = `
    <div id="hdr" style="padding-top:12px" class="hide-tv"></div>
    <div id="ytbox" style="margin-top:10px"><div id="yt"></div><div id="cover"></div>
      <div id="mask" style="display:flex"><div class="mute small">SONG</div><div class="big" id="count">0</div><div class="mute small" style="margin-top:6px">TuneTap</div></div></div>
    <div class="ctrl"><button class="pri" id="nextBtn" style="grid-column:span 2">▶ Next song</button><button id="pause">⏯</button><button id="replay">↺ Clip</button>
      <button id="back10">−10s</button><button id="fwd10">+10s</button><button id="playon">Play on</button><button id="tvBtn">TV mode</button></div>
    <div class="now hide-tv" id="nowWrap"><div class="row"><div class="grow" id="now"></div><button class="ghost sm" id="reveal">Reveal</button></div></div>
    <div class="hide-tv"><div class="tabs">
      <button data-tab="play">Game</button><button data-tab="invite">Invite</button><button data-tab="players">Players</button><button data-tab="claims" id="claimsTab">Claims</button><button data-tab="played">Played</button></div>
      <div class="panel" id="tabBody" style="margin-top:0"></div></div>
    <div class="row" style="margin-top:10px"><button class="ghost sm" id="home">⌂ Home</button></div>`;
  $('#nextBtn').onclick = nextSong;
  $('#pause').onclick = () => { if (!yt || !ytReady) return; const st = yt.getPlayerState(); st === 1 ? yt.pauseVideo() : yt.playVideo(); };
  $('#replay').onclick = () => playCur(false);
  $('#playon').onclick = () => { const s = cur(); if (!s || !ytReady) return; yt.loadVideoById({ videoId: s.id, startSeconds: Math.floor(yt.getCurrentTime() || s.start) }); };
  $('#back10').onclick = () => { if (yt && ytReady) yt.seekTo(Math.max(0, yt.getCurrentTime() - 10), true); };
  $('#fwd10').onclick = () => { if (yt && ytReady) yt.seekTo(yt.getCurrentTime() + 10, true); };
  $('#tvBtn').onclick = () => { tvMode = !tvMode; document.body.classList.toggle('tv', tvMode); $('#tvBtn').textContent = tvMode ? 'Exit TV' : 'TV mode'; };
  $('#reveal').onclick = () => { showTitle = !showTitle; refresh(); };
  $('#home').onclick = () => { try { peer && peer.destroy(); } catch (e) {} document.body.classList.remove('tv'); Home(); };
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; refresh(); });
  if (!Object.keys(G.players).length) tab = 'invite';
  Object.values(G.players).forEach(p => p.online = false);
  refresh(); loadYT(); startPeer(); keepAwake();
  setInterval(() => { if (G.status === 'playing') broadcast(); }, 15000);   // heals any dropped message
  const n = G.claims.findIndex(c => c.open && c.round === G.round); if (n >= 0) setTimeout(() => showClaim(n), 600);
}

/* ======================= PLAYER ======================= */
function Player(code) {
  const KEY = 'p_' + code;
  let me = store.get(KEY, { token: '', name: store.get('name', ''), marks: [] });
  let peer = null, conn = null, st = null, retry = null, connected = false, joined = false, gone = false, pending = false;
  function saveMe() { store.set(KEY, me); }
  function connect() {
    if (gone) return;
    if (!peerOk()) { status('No connection library — check internet and reload'); return; }
    clearTimeout(retry);
    if (!peer || peer.destroyed) {
      peer = new Peer({ debug: 0 });
      peer.on('open', dial);
      peer.on('error', err => { connected = false; status(err.type === 'peer-unavailable' ? 'Waiting for the host… (is the game code right and the host\'s screen on?)' : 'Reconnecting…'); retry = setTimeout(err.type === 'peer-unavailable' ? dial : () => { try { peer.destroy(); } catch (e) {} connect(); }, 3500); });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    } else dial();
  }
  function dial() {
    if (gone) return;
    try { conn && conn.close(); } catch (e) {}
    conn = peer.connect(PREFIX + code, { reliable: true });
    const c = conn; let opened = false;
    c.on('open', () => { opened = true; connected = true; c.send({ t: 'hello', token: me.token, name: me.name, marks: me.marks }); status(''); render(); });
    c.on('data', onData);
    c.on('close', () => { if (c !== conn) return; connected = false; status('Lost the host — reconnecting…'); retry = setTimeout(dial, 2500); });
    setTimeout(() => { if (!opened && c === conn) { status('Waiting for the host…'); dial(); } }, 8000);
  }
  function onData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'welcome') { me.token = d.token; saveMe(); }
    else if (d.t === 'state') { st = d; if (d.you && !me.marks.some(Boolean) && d.you.marks.some(Boolean)) { me.marks = d.you.marks.slice(); saveMe(); } render(); }
    else if (d.t === 'result') { pending = false; const b = $('#bingo'); if (b) { b.disabled = false; b.textContent = 'BINGO!'; } modal(`<h2>${d.ok ? '🎉 You won!' : 'Not yet'}</h2><p>${esc(d.msg)}</p><button class="pri" style="width:100%;margin-top:10px" id="okm">OK</button>`); $('#okm').onclick = closeModal; buzz(d.ok ? [100, 50, 100, 50, 300] : 200); }
    else if (d.t === 'announce') { toast(d.msg, 4500); buzz(150); }
    else if (d.t === 'bye') { gone = true; app.innerHTML = `<div class="hero"><h1>TuneTap</h1><p class="mute">${esc(d.msg)}</p></div>`; store.del(KEY); try { peer.destroy(); } catch (e) {} }
  }
  function status(t) { const el = $('#pstat'); if (el) { el.textContent = t; el.style.display = t ? 'block' : 'none'; } const dt = $('#pdot'); if (dt) dt.classList.toggle('on', connected); }
  function joinScreen() {
    app.innerHTML = `<div class="hero"><span class="tag hot">Game ${esc(code)}</span><h1 style="margin-top:10px">TuneTap</h1><p class="mute">Type your name to get your card.</p></div>
      <div class="panel"><label>Your name</label><input id="nm" maxlength="24" value="${esc(me.name)}" placeholder="e.g. Sara" autocomplete="given-name">
      <button class="pri" style="width:100%;margin-top:12px" id="go">Get my card</button></div>`;
    $('#go').onclick = () => { const n = $('#nm').value.trim(); if (!n) { toast('Add your name'); return; } me.name = n; store.set('name', n); saveMe(); joined = true; keepAwake(); render(); connect(); };
  }
  function render() {
    if (!joined) return;
    if (!st || !st.you) {
      app.innerHTML = `<div class="hero"><span class="tag hot">Game ${esc(code)}</span><h1 style="margin-top:10px">Hi ${esc(me.name)}</h1></div><div class="panel"><p>Connecting to the host…</p><p class="mute small" id="pstat"></p></div>`;
      return;
    }
    const y = st.you; const size = Math.round(Math.sqrt(y.card.length));
    const songsForCard = y.songs.map(s => s || {});
    const lastWin = st.winners.length ? st.winners[st.winners.length - 1] : null;
    app.innerHTML = `
      <div class="row" style="padding-top:12px"><span class="tag"><span class="dot ${connected ? 'on' : ''}" id="pdot"></span>${esc(y.name)}</span><span class="grow"></span><span class="tag">Song ${st.songNo}</span></div>
      <div style="margin-top:12px"><div class="mute small">${st.status === 'ended' ? 'Game finished' : `Round ${st.round} of ${st.rounds}`}</div>
        <div class="disp" style="font-size:26px;font-weight:800">${esc(st.patternName)}</div>
        ${st.pattern ? `<div class="mute small">${esc(Logic.PATTERNS[st.pattern].desc)}</div>` : ''}</div>
      <div class="banner" id="pstat" style="display:none;background:rgba(255,194,75,.14);color:#ffd98a"></div>
      ${lastWin ? `<div class="banner win">🏆 ${esc(lastWin.name)} won ${esc(Logic.PATTERNS[lastWin.pattern].name)}</div>` : ''}
      <div id="cardWrap"><div class="grid" style="grid-template-columns:repeat(${size},1fr)" data-size="${size}"></div></div>
      <p class="mute small" style="margin-top:8px">Tap a square when you hear that song. Tap again to unmark.</p>
      <button class="bingo" id="bingo" ${st.status !== 'playing' || !st.pattern || pending ? 'disabled' : ''}>${pending ? 'Host is checking…' : 'BINGO!'}</button>`;
    // cardHtml indexes songs by song id; map card -> local list
    const grid = $('#cardWrap .grid');
    grid.innerHTML = y.card.map((s, i) => s === -1 ? `<div class="cell free m" data-i="${i}">FREE</div>` :
      `<div class="cell ${me.marks[i] ? 'm' : ''}" data-i="${i}"><div class="t">${esc(y.songs[i].title)}</div>${y.songs[i].artist ? `<div class="a">${esc(y.songs[i].artist)}</div>` : ''}</div>`).join('');
    fitCells(grid, size);
    grid.querySelectorAll('.cell:not(.free)').forEach(el => el.onclick = () => {
      const i = +el.dataset.i; me.marks[i] = !me.marks[i]; el.classList.toggle('m', me.marks[i]); saveMe(); buzz(15);
      if (conn && conn.open) conn.send({ t: 'mark', i, on: me.marks[i] });
    });
    $('#bingo').onclick = () => {
      if (!conn || !conn.open) { toast('Not connected to the host yet'); return; }
      conn.send({ t: 'claim' }); pending = true; const b = $('#bingo'); b.disabled = true; b.textContent = 'Host is checking…'; buzz(60);
    };
    status(connected ? '' : 'Reconnecting…');
  }
  window.addEventListener('resize', () => { const g = $('#cardWrap .grid'); if (g) fitCells(g, +g.dataset.size); });
  if (me.token && me.name) { joined = true; render(); connect(); } else joinScreen();
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#yes')) closeModal(); });
})();
</script>
</body>
</html>
